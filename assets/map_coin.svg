<svg xmlns="http://www.w3.org/2000/svg" width="104" height="104" viewBox="0 0 104 104" shape-rendering="crispEdges">
  <!-- Transparent, stepped octagonal gold coin. Four source pixels form each edge step. -->
  <path fill="#70401e" d="M36 4h32v4h12v8h8v8h8v12h4v32h-4v12h-8v8h-8v8H68v4H36v-4H24v-8h-8v-8H8V68H4V36h4V24h8v-8h8V8h12z"/>
  <!-- Outer orange rim. -->
  <path fill="#c87927" d="M36 8h32v4h12v8h8v8h8v12h4v24h-4v12h-8v8h-8v8H68v4H36v-4H24v-8h-8v-8H12V68H8V36h4V24h8v-8h8v-8h8z"/>
  <!-- Raised inner frame, darker than the face. -->
  <path fill="#bd6c24" d="M36 16h32v4h8v8h8v8h8v8h4v20h-4v8h-8v8h-8v8h-8v4H36v-4h-8v-8h-8v-8h-4V44h4v-8h8v-8h8v-8h8z"/>
  <!-- Recessed gold face. -->
  <path fill="#f3bd3f" d="M36 24h32v4h8v8h8v8h4v24h-4v8h-8v8h-8v4H36v-4h-8v-8h-8V44h4v-8h8v-8h4z"/>
  <path fill="#ffd458" d="M36 28h32v4h8v8h8v8h4v16h-4v8h-8v8h-8v4H36v-4h-8v-8h-4V48h4v-8h8z"/>
  <!-- Short diagonal glint on the upper-left face, clear of the emblem. -->
  <path fill="#fff2ad" d="M28 44h8v-8h8v-8h8v8h-4v8h-8v8h-8v4h-4z"/>
  <!-- Bold pixel dollar emblem. -->
  <g fill="#9b511f">
    <rect x="48" y="36" width="8" height="32"/>
    <rect x="40" y="40" width="28" height="8"/>
    <rect x="60" y="44" width="8" height="8"/>
    <rect x="40" y="48" width="28" height="8"/>
    <rect x="36" y="52" width="8" height="8"/>
    <rect x="40" y="56" width="28" height="8"/>
  </g>
  <!-- Small rim glint and rounded lower-right shade. -->
  <path fill="#fff0ae" d="M20 32h4v-8h8v-4h12v4H32v4h-4v8h-4v4h-4z"/>
  <path fill="#8e4b22" d="M84 68h8v-8h4v12h-4v8h-8v8H68v-4h12v-8h4z"/>
  <path fill="#c77929" d="M76 68h8v-8h4v12h-4v8h-8v4h-8v-4h8z"/>
</svg>
